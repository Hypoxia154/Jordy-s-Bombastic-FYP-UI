services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: crag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: crag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: crag-backend
    depends_on:
      - qdrant
      - ollama
    environment:
      SQLITE_PATH: /app/data/app.db
      TOKEN_TTL_MINUTES: 720
      CORS_ALLOW_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: crag-frontend
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000
    expose:
      - "8501"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: crag-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_storage:
  backend_data: